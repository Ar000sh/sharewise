name: Test and publish containers

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --maxWorkers=2
      - run: npx --yes @redocly/cli@2 lint ../docs/api/openapi.yaml

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Hosted Linux runners provide Docker for PostgreSQL/Keycloak Testcontainers.
      - run: sh ./mvnw -B verify
        working-directory: backend

  images:
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Choose image names
        shell: bash
        run: |
          echo "IMAGE_BASE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      # Build both before pushing either. Branches and PRs build but do not publish.
      - name: Build both images
        run: |
          docker build --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$IMAGE_BASE/frontend:sha-$GITHUB_SHA" frontend
          docker build --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$IMAGE_BASE/backend:sha-$GITHUB_SHA" backend
      - name: Publish from the default branch
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for component in frontend backend; do
            docker push "$IMAGE_BASE/$component:sha-$GITHUB_SHA"
          done
          {
            echo 'Images published. Copy these two lines into the VM .env.deploy.local:'
            echo '```dotenv'
            echo "FRONTEND_IMAGE=$IMAGE_BASE/frontend:sha-$GITHUB_SHA"
            echo "BACKEND_IMAGE=$IMAGE_BASE/backend:sha-$GITHUB_SHA"
            echo '```'
            echo 'Deployment on docker-01 is a separate manual step; see DEPLOYING.md.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Clear registry login
        if: always()
        run: docker logout ghcr.io
