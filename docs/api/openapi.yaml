openapi: 3.1.0
info:
  title: ShareWise API
  version: 0.1.0-ex4
  description: >
    Backend contract for the Ex4 slice (create group, invite and join, record an
    equal-split expense, see balances). Paths are the backend's. The browser calls
    them under /api on Next.js, which forwards /api/x to BACKEND_URL/x.
    Sign-up and sign-in are not part of this API: Keycloak handles them. Every endpoint expects
    "Authorization: Bearer <Keycloak access token>". The browser never gets the tokens directly: the
    Next.js server keeps them in an httpOnly cookie. Keycloak's sign-in, registration and sign-out
    pages are opened by the browser directly.
    Money is a decimal string with two decimals (EUR), for example "900.00", never a JSON number. Ids are UUIDs.
    Change this file first, in its own commit, before any code that depends on it.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: account
  - name: group
  - name: expense
  - name: settlement
  - name: notification

paths:
  /me:
    get:
      tags: [account]
      operationId: getMe
      summary: The current user
      responses:
        "200":
          description: The caller
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
              example: { userId: "aaaaaaaa-0000-0000-0000-000000000001", displayName: Alice, username: alice }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /groups:
    get:
      tags: [group]
      operationId: listGroups
      summary: Groups the caller is a member of
      responses:
        "200":
          description: My groups
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Group" }
              example:
                - { id: "bbbbbbbb-0000-0000-0000-000000000001", name: "Mallorca 2027", status: OPEN, memberCount: 4 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      tags: [group]
      operationId: createGroup
      summary: Create a group. The caller becomes its ADMIN member. Status starts OPEN, currency is EUR.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateGroupRequest" }
            example: { name: "Mallorca 2027" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
              example: { id: "bbbbbbbb-0000-0000-0000-000000000001", name: "Mallorca 2027", status: OPEN, memberCount: 1 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /groups/{groupId}:
    parameters:
      - { $ref: "#/components/parameters/GroupId" }
    get:
      tags: [group]
      operationId: getGroup
      summary: Group detail with members
      responses:
        "200":
          description: The group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupDetail" }
              example:
                id: "bbbbbbbb-0000-0000-0000-000000000001"
                name: "Mallorca 2027"
                status: OPEN
                memberCount: 2
                members:
                  - { userId: "aaaaaaaa-0000-0000-0000-000000000001", displayName: Alice, role: ADMIN }
                  - { userId: "aaaaaaaa-0000-0000-0000-000000000002", displayName: Bob, role: MEMBER }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/NotAMember" }
        "404": { $ref: "#/components/responses/GroupNotFound" }

  /groups/{groupId}/invitations:
    parameters:
      - { $ref: "#/components/parameters/GroupId" }
    post:
      tags: [group]
      operationId: createInvitation
      summary: >
        Invite an existing account by exact username or exact email (valid 7 days, R9). The caller must be a
        member. The invitation belongs to that account; there is no link anyone can use.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InviteMemberRequest" }
            example: { identifier: bob }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invitation" }
              example:
                invitationId: "dddddddd-0000-0000-0000-000000000001"
                invitee: { userId: "aaaaaaaa-0000-0000-0000-000000000002", displayName: Bob, username: bob }
                expiresAt: "2027-06-08T10:00:00Z"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/NotAMember" }
        "404":
          description: Unknown group, or no account for the username or email
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples:
                groupNotFound:
                  value: { type: "about:blank", title: Not Found, status: 404, code: GROUP_NOT_FOUND, detail: "Group not found" }
                accountNotFound:
                  value: { type: "about:blank", title: Not Found, status: 404, code: ACCOUNT_NOT_FOUND, detail: "No account found" }
        "409":
          description: The person is already a member, or already has an open invitation to this group
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples:
                alreadyMember:
                  value: { type: "about:blank", title: Conflict, status: 409, code: ALREADY_MEMBER, detail: "This person is already a member of this group" }
                alreadyInvited:
                  value: { type: "about:blank", title: Conflict, status: 409, code: ALREADY_INVITED, detail: "This person already has an open invitation" }

  /invitations:
    get:
      tags: [group]
      operationId: listPendingInvitations
      summary: The caller's own open invitations (not accepted, declined or older than 7 days), newest first.
      responses:
        "200":
          description: Pending invitations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PendingInvitation" }
              example:
                - invitationId: "dddddddd-0000-0000-0000-000000000001"
                  group: { id: "bbbbbbbb-0000-0000-0000-000000000001", name: "Mallorca 2027" }
                  invitedBy: { userId: "aaaaaaaa-0000-0000-0000-000000000001", displayName: Alice, username: alice }
                  expiresAt: "2027-06-08T10:00:00Z"
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /invitations/{invitationId}/accept:
    parameters:
      - { $ref: "#/components/parameters/InvitationId" }
    post:
      tags: [group]
      operationId: acceptInvitation
      summary: >
        Join the group. Only the invited account can accept; an invitation meant for somebody else is
        INVITATION_NOT_FOUND. The caller becomes a MEMBER.
      responses:
        "200":
          description: Joined
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
              example: { id: "bbbbbbbb-0000-0000-0000-000000000001", name: "Mallorca 2027", status: OPEN, memberCount: 2 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/InvitationNotFound" }
        "409": { $ref: "#/components/responses/AlreadyMember" }
        "410": { $ref: "#/components/responses/InvitationExpired" }

  /invitations/{invitationId}/decline:
    parameters:
      - { $ref: "#/components/parameters/InvitationId" }
    post:
      tags: [group]
      operationId: declineInvitation
      summary: Decline the invitation. Only the invited account can decline; nobody joins.
      responses:
        "204": { description: Declined }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/InvitationNotFound" }
        "410": { $ref: "#/components/responses/InvitationExpired" }

  /notifications:
    get:
      tags: [notification]
      operationId: listNotifications
      summary: >
        The caller's inbox entries about things that happened (somebody joined, somebody declined), newest
        first, plus the number of unread ones. An invitation that waits for an answer is not an entry: it is in
        GET /invitations.
      parameters:
        - name: unread
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: Only unread entries.
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        "200":
          description: The entries and the unread count
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationList" }
              example:
                unreadCount: 1
                items:
                  - id: "eeeeeeee-0000-0000-0000-000000000001"
                    type: MEMBER_JOINED
                    occurredAt: "2027-06-02T09:30:00Z"
                    readAt: null
                    actor: { userId: "aaaaaaaa-0000-0000-0000-000000000002", displayName: Bob, username: bob }
                    group: { id: "bbbbbbbb-0000-0000-0000-000000000001", name: "Mallorca 2027" }
                    reference: "aaaaaaaa-0000-0000-0000-000000000002"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /notifications/read-all:
    post:
      tags: [notification]
      operationId: markAllNotificationsRead
      summary: Marks all of the caller's entries as read.
      responses:
        "204": { description: Done }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /notifications/{notificationId}/read:
    parameters:
      - name: notificationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [notification]
      operationId: markNotificationRead
      summary: Marks one of the caller's entries as read. Another person's entry is NOTIFICATION_NOT_FOUND.
      responses:
        "204": { description: Done }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotificationNotFound" }

  /groups/{groupId}/expenses:
    parameters:
      - { $ref: "#/components/parameters/GroupId" }
    get:
      tags: [expense]
      operationId: listExpenses
      summary: Expenses of the group, newest first
      responses:
        "200":
          description: Expenses with their shares
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Expense" }
              example:
                - id: "cccccccc-0000-0000-0000-000000000002"
                  title: Dinner
                  totalAmount: "180.00"
                  date: "2027-06-02"
                  paidBy: "aaaaaaaa-0000-0000-0000-000000000002"
                  recordedBy: "aaaaaaaa-0000-0000-0000-000000000002"
                  splitStrategy: EQUAL
                  status: ACTIVE
                  shares:
                    - { participantId: "aaaaaaaa-0000-0000-0000-000000000001", owedShare: "45.00" }
                    - { participantId: "aaaaaaaa-0000-0000-0000-000000000002", owedShare: "45.00" }
                    - { participantId: "aaaaaaaa-0000-0000-0000-000000000003", owedShare: "45.00" }
                    - { participantId: "aaaaaaaa-0000-0000-0000-000000000004", owedShare: "45.00" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/NotAMember" }
        "404": { $ref: "#/components/responses/GroupNotFound" }
    post:
      tags: [expense]
      operationId: recordExpense
      summary: Record an expense. Only splitStrategy EQUAL is supported in Ex4.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordExpenseRequest" }
            example:
              title: Hotel
              totalAmount: "900.00"
              date: "2027-06-01"
              paidBy: "aaaaaaaa-0000-0000-0000-000000000001"
              participantIds:
                - "aaaaaaaa-0000-0000-0000-000000000001"
                - "aaaaaaaa-0000-0000-0000-000000000002"
                - "aaaaaaaa-0000-0000-0000-000000000003"
                - "aaaaaaaa-0000-0000-0000-000000000004"
              splitStrategy: EQUAL
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Expense" }
              example:
                id: "cccccccc-0000-0000-0000-000000000001"
                title: Hotel
                totalAmount: "900.00"
                date: "2027-06-01"
                paidBy: "aaaaaaaa-0000-0000-0000-000000000001"
                recordedBy: "aaaaaaaa-0000-0000-0000-000000000001"
                splitStrategy: EQUAL
                status: ACTIVE
                shares:
                  - { participantId: "aaaaaaaa-0000-0000-0000-000000000001", owedShare: "225.00" }
                  - { participantId: "aaaaaaaa-0000-0000-0000-000000000002", owedShare: "225.00" }
                  - { participantId: "aaaaaaaa-0000-0000-0000-000000000003", owedShare: "225.00" }
                  - { participantId: "aaaaaaaa-0000-0000-0000-000000000004", owedShare: "225.00" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/NotAMember" }
        "404": { $ref: "#/components/responses/GroupNotFound" }
        "422": { $ref: "#/components/responses/DomainRule" }

  /groups/{groupId}/balances:
    parameters:
      - { $ref: "#/components/parameters/GroupId" }
    get:
      tags: [settlement]
      operationId: getBalances
      summary: Balance of every current member (0 when no expenses). The sum is always 0.
      description: Balances are eventually consistent with recorded expenses.
      responses:
        "200":
          description: Balances (+ is owed, - owes)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Balance" }
              example:
                - { userId: "aaaaaaaa-0000-0000-0000-000000000001", displayName: Alice, netBalance: "630.00" }
                - { userId: "aaaaaaaa-0000-0000-0000-000000000002", displayName: Bob, netBalance: "-90.00" }
                - { userId: "aaaaaaaa-0000-0000-0000-000000000003", displayName: Carol, netBalance: "-270.00" }
                - { userId: "aaaaaaaa-0000-0000-0000-000000000004", displayName: David, netBalance: "-270.00" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/NotAMember" }
        "404": { $ref: "#/components/responses/GroupNotFound" }

  /groups/{groupId}/settlement-plan:
    parameters:
      - { $ref: "#/components/parameters/GroupId" }
    get:
      tags: [settlement]
      operationId: getSettlementPlan
      summary: Who should pay whom to settle the group (one edge per debtor and creditor pair)
      description: >
        Computed from the booked balances (eventually consistent), in the order creditor, then debtor id.
        pendingAmount is the part of amount already reserved on that pair by payments that are PENDING or
        confirmed but not yet booked. payableAmount is what the server would accept as a new payment (or
        waiver) on that pair right now; it can be lower than amount minus pendingAmount when the debtor's
        other reservations, or the creditor's, use up the rest.
      responses:
        "200":
          description: Settlement plan edges (empty when everything is settled)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SettlementPlanEdge" }
              example:
                - fromDebtor: "aaaaaaaa-0000-0000-0000-000000000002"
                  fromDebtorName: Bob
                  toCreditor: "aaaaaaaa-0000-0000-0000-000000000001"
                  toCreditorName: Alice
                  amount: "90.00"
                  pendingAmount: "0.00"
                  payableAmount: "90.00"
                - fromDebtor: "aaaaaaaa-0000-0000-0000-000000000003"
                  fromDebtorName: Carol
                  toCreditor: "aaaaaaaa-0000-0000-0000-000000000001"
                  toCreditorName: Alice
                  amount: "270.00"
                  pendingAmount: "270.00"
                  payableAmount: "0.00"
                - fromDebtor: "aaaaaaaa-0000-0000-0000-000000000004"
                  fromDebtorName: David
                  toCreditor: "aaaaaaaa-0000-0000-0000-000000000001"
                  toCreditorName: Alice
                  amount: "270.00"
                  pendingAmount: "0.00"
                  payableAmount: "270.00"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/NotAMember" }
        "404": { $ref: "#/components/responses/GroupNotFound" }

  /groups/{groupId}/settlement-payments:
    parameters:
      - { $ref: "#/components/parameters/GroupId" }
    get:
      tags: [settlement]
      operationId: listSettlementPayments
      summary: Settlement payments of the group (all statuses), newest first
      responses:
        "200":
          description: Settlement payments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SettlementPayment" }
              example:
                - id: "dddddddd-0000-0000-0000-000000000001"
                  groupId: "bbbbbbbb-0000-0000-0000-000000000001"
                  fromDebtor: "aaaaaaaa-0000-0000-0000-000000000003"
                  fromDebtorName: Carol
                  toCreditor: "aaaaaaaa-0000-0000-0000-000000000001"
                  toCreditorName: Alice
                  amount: "270.00"
                  status: PENDING
                  note: "Bank transfer"
                  createdAt: "2027-06-10T10:00:00Z"
                  resolvedAt: null
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/NotAMember" }
        "404": { $ref: "#/components/responses/GroupNotFound" }
    post:
      tags: [settlement]
      operationId: recordSettlementPayment
      summary: The caller (the debtor) reports a payment to a creditor. Status starts PENDING until the creditor confirms.
      description: >
        The amount reserves that much of the open debt to the creditor, so it may not exceed the open debt
        minus other PENDING payments (422 PAYMENT_EXCEEDS_OPEN_DEBT). A group that is archived answers 422 GROUP_NOT_OPEN.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordSettlementPaymentRequest" }
            example: { toCreditor: "aaaaaaaa-0000-0000-0000-000000000001", amount: "270.00", note: "Bank transfer" }
      responses:
        "201":
          description: Recorded, status PENDING
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettlementPayment" }
              example:
                id: "dddddddd-0000-0000-0000-000000000001"
                groupId: "bbbbbbbb-0000-0000-0000-000000000001"
                fromDebtor: "aaaaaaaa-0000-0000-0000-000000000003"
                fromDebtorName: Carol
                toCreditor: "aaaaaaaa-0000-0000-0000-000000000001"
                toCreditorName: Alice
                amount: "270.00"
                status: PENDING
                note: "Bank transfer"
                createdAt: "2027-06-10T10:00:00Z"
                resolvedAt: null
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/NotAMember" }
        "404": { $ref: "#/components/responses/GroupNotFound" }
        "422": { $ref: "#/components/responses/PaymentExceedsOpenDebt" }

  /settlement-payments/{paymentId}/confirm:
    parameters:
      - { $ref: "#/components/parameters/PaymentId" }
    post:
      tags: [settlement]
      operationId: confirmSettlementPayment
      summary: The creditor confirms a PENDING payment. Status becomes CONFIRMED and the debt shrinks.
      responses:
        "200":
          description: Confirmed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettlementPayment" }
              example:
                id: "dddddddd-0000-0000-0000-000000000001"
                groupId: "bbbbbbbb-0000-0000-0000-000000000001"
                fromDebtor: "aaaaaaaa-0000-0000-0000-000000000003"
                fromDebtorName: Carol
                toCreditor: "aaaaaaaa-0000-0000-0000-000000000001"
                toCreditorName: Alice
                amount: "270.00"
                status: CONFIRMED
                note: "Bank transfer"
                createdAt: "2027-06-10T10:00:00Z"
                resolvedAt: "2027-06-11T09:30:00Z"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/NotTheCreditor" }
        "404": { $ref: "#/components/responses/SettlementPaymentNotFound" }
        "409": { $ref: "#/components/responses/PaymentNotPending" }

  /settlement-payments/{paymentId}/reject:
    parameters:
      - { $ref: "#/components/parameters/PaymentId" }
    post:
      tags: [settlement]
      operationId: rejectSettlementPayment
      summary: The creditor rejects a PENDING payment with a reason. Status becomes REJECTED and the reservation is released.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RejectSettlementPaymentRequest" }
            example: { note: "Money has not arrived" }
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettlementPayment" }
              example:
                id: "dddddddd-0000-0000-0000-000000000001"
                groupId: "bbbbbbbb-0000-0000-0000-000000000001"
                fromDebtor: "aaaaaaaa-0000-0000-0000-000000000003"
                fromDebtorName: Carol
                toCreditor: "aaaaaaaa-0000-0000-0000-000000000001"
                toCreditorName: Alice
                amount: "270.00"
                status: REJECTED
                note: "Money has not arrived"
                createdAt: "2027-06-10T10:00:00Z"
                resolvedAt: "2027-06-11T09:30:00Z"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/NotTheCreditor" }
        "404": { $ref: "#/components/responses/SettlementPaymentNotFound" }
        "409": { $ref: "#/components/responses/PaymentNotPending" }

  /groups/{groupId}/debt-waivers:
    parameters:
      - { $ref: "#/components/parameters/GroupId" }
    post:
      tags: [settlement]
      operationId: waiveDebt
      summary: The caller (the creditor) waives part of a debtor's debt. Recorded as a settlement payment with status WAIVED.
      description: >
        Takes effect at once, no confirmation needed. The amount may not exceed the open debt
        (422 PAYMENT_EXCEEDS_OPEN_DEBT). A reason (note) is required.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WaiveDebtRequest" }
            example: { fromDebtor: "aaaaaaaa-0000-0000-0000-000000000002", amount: "90.00", note: "Bob gets it as a gift" }
      responses:
        "201":
          description: Waived, status WAIVED
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettlementPayment" }
              example:
                id: "dddddddd-0000-0000-0000-000000000002"
                groupId: "bbbbbbbb-0000-0000-0000-000000000001"
                fromDebtor: "aaaaaaaa-0000-0000-0000-000000000002"
                fromDebtorName: Bob
                toCreditor: "aaaaaaaa-0000-0000-0000-000000000001"
                toCreditorName: Alice
                amount: "90.00"
                status: WAIVED
                note: "Bob gets it as a gift"
                createdAt: "2027-06-10T10:00:00Z"
                resolvedAt: "2027-06-10T10:00:00Z"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/NotAMember" }
        "404": { $ref: "#/components/responses/GroupNotFound" }
        "422": { $ref: "#/components/responses/PaymentExceedsOpenDebt" }

  /me/settlement-payments:
    get:
      tags: [settlement]
      operationId: listMySettlementPayments
      summary: Settlement payments waiting for the caller's answer, newest first
      description: >
        The PENDING payments in which the caller is the creditor and so is the one to confirm or reject.
        This is state, asked like the caller's open invitations; what happened to a payment arrives as a
        notification.
      responses:
        "200":
          description: Settlement payments waiting for the caller's answer
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SettlementPayment" }
              example:
                - id: "dddddddd-0000-0000-0000-000000000001"
                  groupId: "bbbbbbbb-0000-0000-0000-000000000001"
                  fromDebtor: "aaaaaaaa-0000-0000-0000-000000000003"
                  fromDebtorName: Carol
                  toCreditor: "aaaaaaaa-0000-0000-0000-000000000001"
                  toCreditorName: Alice
                  amount: "270.00"
                  status: PENDING
                  note: "Bank transfer"
                  createdAt: "2027-06-10T10:00:00Z"
                  resolvedAt: null
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/NotAMember" }
        "404": { $ref: "#/components/responses/GroupNotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak access token (a JWT). The browser never sees it; the Next.js server keeps it in an httpOnly session cookie and forwards it.

  parameters:
    GroupId:
      name: groupId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Malformed JSON, missing or mistyped fields, malformed UUID
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example: { type: "about:blank", title: Bad Request, status: 400, code: BAD_REQUEST, detail: "name must not be blank" }
    Unauthenticated:
      description: No, invalid or expired access token
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example: { type: "about:blank", title: Unauthorized, status: 401, code: UNAUTHENTICATED, detail: "Missing or invalid token" }
    NotAMember:
      description: The caller is not a member of the group
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example: { type: "about:blank", title: Forbidden, status: 403, code: NOT_A_MEMBER, detail: "You are not a member of this group" }
    GroupNotFound:
      description: Unknown group
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example: { type: "about:blank", title: Not Found, status: 404, code: GROUP_NOT_FOUND, detail: "Group not found" }
    InvitationNotFound:
      description: >
        Unknown invitation, already answered, or meant for somebody else (the three look the same, so ids
        cannot be probed)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example: { type: "about:blank", title: Not Found, status: 404, code: INVITATION_NOT_FOUND, detail: "Invitation not found" }
    NotificationNotFound:
      description: Unknown entry, or an entry of another person
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example: { type: "about:blank", title: Not Found, status: 404, code: NOTIFICATION_NOT_FOUND, detail: "Notification not found" }
    AlreadyMember:
      description: The caller is already a member
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example: { type: "about:blank", title: Conflict, status: 409, code: ALREADY_MEMBER, detail: "You are already a member of this group" }
    InvitationExpired:
      description: The invitation is older than 7 days
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example: { type: "about:blank", title: Gone, status: 410, code: INVITATION_EXPIRED, detail: "This invitation has expired" }
    DomainRule:
      description: >
        A domain rule was violated. code is one of AMOUNT_NOT_POSITIVE, PAYER_NOT_IN_GROUP,
        PARTICIPANT_NOT_IN_GROUP, NO_PARTICIPANTS, GROUP_NOT_OPEN, SPLIT_NOT_SUPPORTED.
        GROUP_NOT_OPEN means the group is archived (also for settlement calls).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example: { type: "about:blank", title: Unprocessable Entity, status: 422, code: PAYER_NOT_IN_GROUP, detail: "The payer is not a member of this group" }
    PaymentExceedsOpenDebt:
      description: >
        The amount is larger than the open debt (minus other PENDING payments). code is
        PAYMENT_EXCEEDS_OPEN_DEBT, or AMOUNT_NOT_POSITIVE, PARTICIPANT_NOT_IN_GROUP or GROUP_NOT_OPEN (group is archived).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example: { type: "about:blank", title: Unprocessable Entity, status: 422, code: PAYMENT_EXCEEDS_OPEN_DEBT, detail: "The amount is larger than the open debt" }
    SettlementPaymentNotFound:
      description: Unknown settlement payment
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example: { type: "about:blank", title: Not Found, status: 404, code: SETTLEMENT_PAYMENT_NOT_FOUND, detail: "Settlement payment not found" }
    PaymentNotPending:
      description: The payment is no longer PENDING (already confirmed, rejected or waived)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example: { type: "about:blank", title: Conflict, status: 409, code: PAYMENT_NOT_PENDING, detail: "The payment is not pending" }
    NotTheCreditor:
      description: Only the creditor of the payment may do this
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example: { type: "about:blank", title: Forbidden, status: 403, code: NOT_THE_CREDITOR, detail: "Only the creditor can resolve this payment" }

  schemas:
    Problem:
      type: object
      required: [status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          enum:
            - BAD_REQUEST
            - UNAUTHENTICATED
            - NOT_A_MEMBER
            - GROUP_NOT_FOUND
            - INVITATION_NOT_FOUND
            - ALREADY_MEMBER
            - INVITATION_EXPIRED
            - AMOUNT_NOT_POSITIVE
            - PAYER_NOT_IN_GROUP
            - PARTICIPANT_NOT_IN_GROUP
            - NO_PARTICIPANTS
            - GROUP_NOT_OPEN
            - SPLIT_NOT_SUPPORTED
            - PAYMENT_EXCEEDS_OPEN_DEBT
            - SETTLEMENT_PAYMENT_NOT_FOUND
            - PAYMENT_NOT_PENDING
            - NOT_THE_CREDITOR
            - ACCOUNT_NOT_FOUND
            - ALREADY_INVITED
            - NOTIFICATION_NOT_FOUND
        detail: { type: string }

    User:
      type: object
      required: [userId, displayName, username]
      properties:
        userId: { type: string, format: uuid }
        displayName: { type: string }
        username: { type: string, description: "Lower case, 3 to 30 characters of a-z 0-9 . _ -, chosen at sign-up." }

    UserSummary:
      type: object
      required: [userId, displayName, username]
      properties:
        userId: { type: string, format: uuid }
        displayName: { type: string }
        username: { type: string }

    GroupRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    CreateGroupRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }

    Group:
      type: object
      required: [id, name, status, memberCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [OPEN, CLOSED_FOR_SETTLEMENT, ARCHIVED] }
        memberCount: { type: integer, minimum: 0 }

    Member:
      type: object
      required: [userId, displayName, role]
      properties:
        userId: { type: string, format: uuid }
        displayName: { type: string }
        role: { type: string, enum: [ADMIN, MEMBER] }

    GroupDetail:
      allOf:
        - $ref: "#/components/schemas/Group"
        - type: object
          required: [members]
          properties:
            members:
              type: array
              items: { $ref: "#/components/schemas/Member" }

    InviteMemberRequest:
      type: object
      required: [identifier]
      properties:
        identifier:
          type: string
          minLength: 1
          maxLength: 254
          description: >
            Exact username or exact email of an existing account (an identifier with "@" is an email).
            Trimmed and compared case-insensitively; no partial matching.

    Invitation:
      type: object
      required: [invitationId, invitee, expiresAt]
      properties:
        invitationId: { type: string, format: uuid }
        invitee: { $ref: "#/components/schemas/UserSummary" }
        expiresAt: { type: string, format: date-time }

    PendingInvitation:
      type: object
      required: [invitationId, group, invitedBy, expiresAt]
      properties:
        invitationId: { type: string, format: uuid }
        group: { $ref: "#/components/schemas/GroupRef" }
        invitedBy: { $ref: "#/components/schemas/UserSummary" }
        expiresAt: { type: string, format: date-time }

    NotificationType:
      type: string
      enum: [MEMBER_JOINED, INVITATION_DECLINED, PAYMENT_CONFIRMED, PAYMENT_REJECTED, DEBT_WAIVED]
      description: >
        PAYMENT_CONFIRMED and PAYMENT_REJECTED tell the payer how the creditor answered; DEBT_WAIVED tells the
        debtor that the creditor forgave part of the debt. The actor is the creditor and the reference is the
        settlement payment. A payment waiting for an answer is not an entry (see GET /me/settlement-payments).
        More types arrive with later features (removal).

    Notification:
      type: object
      required: [id, type, occurredAt, readAt, actor, group, reference]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/NotificationType" }
        occurredAt: { type: string, format: date-time }
        readAt: { type: [string, "null"], format: date-time }
        actor:
          description: Who did it (the person who joined or declined); null when the account cannot be resolved.
          oneOf:
            - { $ref: "#/components/schemas/UserSummary" }
            - { type: "null" }
        group:
          description: The group it is about; null when the group cannot be resolved.
          oneOf:
            - { $ref: "#/components/schemas/GroupRef" }
            - { type: "null" }
        reference:
          type: string
          format: uuid
          description: What the entry points at (the person who joined, or the declined invitation).

    NotificationList:
      type: object
      required: [unreadCount, items]
      properties:
        unreadCount: { type: integer, minimum: 0 }
        items:
          type: array
          items: { $ref: "#/components/schemas/Notification" }

    Amount:
      type: string
      pattern: '^-?(0|[1-9]\d*)\.\d{2}$'
      description: Money as a decimal string with exactly two decimals (EUR), e.g. "900.00".
      example: "900.00"

    SplitStrategy:
      type: string
      enum: [EQUAL, EXACT, PERCENTAGE]
      description: Only EQUAL is accepted in Ex4. The others answer 422 SPLIT_NOT_SUPPORTED.

    ExpenseStatus:
      type: string
      enum: [ACTIVE, CORRECTED, REMOVED]

    RecordExpenseRequest:
      type: object
      required: [title, totalAmount, date, paidBy, participantIds, splitStrategy]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        totalAmount:
          allOf: [{ $ref: "#/components/schemas/Amount" }]
          description: Must be greater than zero (AMOUNT_NOT_POSITIVE otherwise).
        date: { type: string, format: date }
        paidBy: { type: string, format: uuid }
        participantIds:
          type: array
          items: { type: string, format: uuid }
          description: Distinct member ids, at least one. Order decides who gets the remainder cents.
        splitStrategy: { $ref: "#/components/schemas/SplitStrategy" }

    ExpenseShare:
      type: object
      required: [participantId, owedShare]
      properties:
        participantId: { type: string, format: uuid }
        owedShare: { $ref: "#/components/schemas/Amount" }

    Expense:
      type: object
      required: [id, title, totalAmount, date, paidBy, recordedBy, splitStrategy, status, shares]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        totalAmount: { $ref: "#/components/schemas/Amount" }
        date: { type: string, format: date }
        paidBy: { type: string, format: uuid }
        recordedBy: { type: string, format: uuid }
        splitStrategy: { $ref: "#/components/schemas/SplitStrategy" }
        status: { $ref: "#/components/schemas/ExpenseStatus" }
        shares:
          type: array
          items: { $ref: "#/components/schemas/ExpenseShare" }

    Balance:
      type: object
      required: [userId, displayName, netBalance]
      properties:
        userId: { type: string, format: uuid }
        displayName: { type: string }
        netBalance:
          allOf: [{ $ref: "#/components/schemas/Amount" }]
          description: "+ is owed, - owes"

    SettlementPlanEdge:
      type: object
      required: [fromDebtor, fromDebtorName, toCreditor, toCreditorName, amount, pendingAmount, payableAmount]
      properties:
        fromDebtor: { type: string, format: uuid }
        fromDebtorName: { type: string }
        toCreditor: { type: string, format: uuid }
        toCreditorName: { type: string }
        amount:
          allOf: [{ $ref: "#/components/schemas/Amount" }]
          description: Open debt of fromDebtor to toCreditor.
        pendingAmount:
          allOf: [{ $ref: "#/components/schemas/Amount" }]
          description: Part of amount reserved on this pair by payments that are PENDING or confirmed but not yet booked.
        payableAmount:
          allOf: [{ $ref: "#/components/schemas/Amount" }]
          description: What the server accepts as a new payment or waiver on this pair right now (the open debt). Show the "I paid" action only when it is above zero.

    SettlementPaymentStatus:
      type: string
      enum: [PENDING, CONFIRMED, REJECTED, WAIVED]

    SettlementPayment:
      type: object
      required: [id, groupId, fromDebtor, fromDebtorName, toCreditor, toCreditorName, amount, status, note, createdAt, resolvedAt]
      properties:
        id: { type: string, format: uuid }
        groupId: { type: string, format: uuid }
        fromDebtor: { type: string, format: uuid }
        fromDebtorName: { type: string }
        toCreditor: { type: string, format: uuid }
        toCreditorName: { type: string }
        amount: { $ref: "#/components/schemas/Amount" }
        status: { $ref: "#/components/schemas/SettlementPaymentStatus" }
        note:
          type: [string, "null"]
          description: Free text of the debtor, the rejection reason or the waiver reason.
        createdAt: { type: string, format: date-time }
        resolvedAt:
          type: [string, "null"]
          format: date-time
          description: Null while PENDING.

    RecordSettlementPaymentRequest:
      type: object
      required: [toCreditor, amount]
      properties:
        toCreditor: { type: string, format: uuid }
        amount:
          allOf: [{ $ref: "#/components/schemas/Amount" }]
          description: Greater than zero (AMOUNT_NOT_POSITIVE otherwise) and at most the open debt.
        note: { type: string, maxLength: 500 }

    RejectSettlementPaymentRequest:
      type: object
      required: [note]
      properties:
        note: { type: string, minLength: 1, maxLength: 500 }

    WaiveDebtRequest:
      type: object
      required: [fromDebtor, amount, note]
      properties:
        fromDebtor: { type: string, format: uuid }
        amount:
          allOf: [{ $ref: "#/components/schemas/Amount" }]
          description: Greater than zero (AMOUNT_NOT_POSITIVE otherwise) and at most the open debt.
        note: { type: string, minLength: 1, maxLength: 500 }
