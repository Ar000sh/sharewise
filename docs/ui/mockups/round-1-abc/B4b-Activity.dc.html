<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trip: Activity</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#0E7468}a:hover{color:#0A4F46}
</style>
</helmet>
<div style="min-height:900px; background:#EEF6F4; color:#10312D; font-family:'Plus Jakarta Sans',system-ui,sans-serif; font-size:15px; line-height:1.5; font-variant-numeric:tabular-nums">

<header style="display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:16px; padding:18px 40px">
<div style="display:flex; align-items:center; gap:10px"><div style="position:relative; width:40px; height:30px"><span style="position:absolute; left:0; top:0; width:30px; height:30px; border-radius:15px; background:#D64527"></span><span style="position:absolute; left:12px; top:0; width:30px; height:30px; border-radius:15px; background:#0E7468; opacity:.9"></span></div><div style="font-size:20px; font-weight:800; letter-spacing:-.02em">ShareWise</div></div>
<nav aria-label="Main" style="display:flex; gap:6px; padding:5px; border-radius:999px; background:#FFFFFF; box-shadow:0 2px 8px rgba(16,49,45,.06)">
<a href="#" style="padding:9px 20px; border-radius:999px; background:#10312D; color:#FFFFFF; font-weight:700; text-decoration:none">My groups</a>
<a href="#" style="display:flex; align-items:center; gap:8px; padding:9px 20px; border-radius:999px; color:#10312D; font-weight:600; text-decoration:none">Inbox<span style="min-width:20px; box-sizing:border-box; padding:0 6px; border-radius:10px; background:#D64527; color:#FFFFFF; font-size:12px; font-weight:700; text-align:center">3</span></a>
<a href="#" style="padding:9px 20px; border-radius:999px; color:#10312D; font-weight:600; text-decoration:none">Activity</a>
</nav>
<div style="width:44px; height:44px; border-radius:22px; background:#D64527; color:#FFFFFF; font-weight:800; display:flex; align-items:center; justify-content:center">A</div>
</header>

<main style="box-sizing:border-box; max-width:1180px; margin:0 auto; padding:6px 40px 44px; display:flex; flex-direction:column; gap:22px">

<div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap"><h1 style="margin:0; font-size:30px; font-weight:800; letter-spacing:-.03em">Mallorca 2027</h1><span style="padding:4px 12px; border-radius:999px; background:#D8F0EB; color:#0A4F46; font-size:12px; font-weight:700">Open</span><span style="color:#55726E">EUR · 5 members · up to date</span></div>

<div role="tablist" aria-label="Group sections" style="display:flex; flex-wrap:wrap; gap:8px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5"><a href="#" role="tab" style="display:flex; align-items:center; gap:8px; min-height:42px; padding:0 20px; border-radius:999px; font-weight:700; text-decoration:none; {{t.style}}">{{t.name}}<sc-if value="{{t.badge}}" hint-placeholder-val="{{false}}"><span style="min-width:20px; box-sizing:border-box; padding:0 6px; border-radius:10px; background:#D64527; color:#FFFFFF; font-size:12px; text-align:center">{{t.badge}}</span></sc-if></a></sc-for>
</div>

<section aria-labelledby="act" style="max-width:780px; display:flex; flex-direction:column; gap:12px">
<div style="display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap"><h2 id="act" style="margin:0; font-size:18px; font-weight:800">Everything that happened</h2>
<div role="group" aria-label="Filter" style="display:flex; gap:6px; flex-wrap:wrap">
<button type="button" aria-pressed="true" style="min-height:38px; padding:0 16px; border:2px solid #0E7468; border-radius:999px; background:#D8F0EB; color:#0A4F46; font:inherit; font-size:13px; font-weight:700">All</button>
<button type="button" aria-pressed="false" style="min-height:38px; padding:0 16px; border:2px solid #C5DAD5; border-radius:999px; background:#FFFFFF; color:#10312D; font:inherit; font-size:13px; font-weight:700">Expenses</button>
<button type="button" aria-pressed="false" style="min-height:38px; padding:0 16px; border:2px solid #C5DAD5; border-radius:999px; background:#FFFFFF; color:#10312D; font:inherit; font-size:13px; font-weight:700">Payments</button>
<button type="button" aria-pressed="false" style="min-height:38px; padding:0 16px; border:2px solid #C5DAD5; border-radius:999px; background:#FFFFFF; color:#10312D; font:inherit; font-size:13px; font-weight:700">Members</button>
</div></div>
<div style="padding:8px 24px 20px; border-radius:28px; background:#FFFFFF; box-shadow:0 4px 14px rgba(16,49,45,.06)">
<sc-for list="{{days}}" as="d" hint-placeholder-count="4">
<div>
<div style="padding:16px 0 8px; font-size:13px; font-weight:800; color:#55726E">{{d.label}}</div>
<sc-for list="{{d.items}}" as="a" hint-placeholder-count="2">
<div style="display:flex; gap:14px; padding:8px 0; align-items:flex-start">
<span style="flex:0 0 auto; width:34px; height:34px; border-radius:17px; background:{{a.c}}; color:#FFFFFF; font-size:13px; font-weight:800; display:flex; align-items:center; justify-content:center">{{a.i}}</span>
<div style="flex:1; min-width:0">{{a.text}}<div style="margin-top:1px"><span style="display:inline-block; padding:0 10px; border-radius:999px; background:#E3EFEC; color:#35534F; font-size:11px; font-weight:700">{{a.kind}}</span></div></div>
<div style="flex:0 0 auto; font-size:12px; color:#55726E">{{a.time}}</div>
</div>
</sc-for>
</div>
</sc-for>
<div style="padding-top:12px"><a href="#" style="font-weight:700">Show earlier</a></div>
</div>
</section>

</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const tabOn = 'background:#10312D; color:#FFFFFF';
const tabOff = 'background:#FFFFFF; color:#10312D';
const A = { i: 'A', c: '#D64527' };
const B = { i: 'B', c: '#0E7468' };
const C = { i: 'C', c: '#5B45C9' };
const D = { i: 'D', c: '#9A6200' };
const E = { i: 'E', c: '#1E64B7' };
return {
tabs: [
{ name: 'Expenses', style: tabOff, badge: '' },
{ name: 'Balances', style: tabOff, badge: '' },
{ name: 'Settle up', style: tabOff, badge: '1' },
{ name: 'Members', style: tabOff, badge: '' },
{ name: 'Activity', style: tabOn, badge: '' }
],
days: [
{ label: 'Today · 19 Jun', items: [
{ ...B, text: 'Bob reported a payment of 136,00 € to Alice', kind: 'Payment', time: '21:40' },
{ ...A, text: 'Alice recorded Farewell dinner · 250,00 €', kind: 'Expense', time: '21:14' }
] },
{ label: '18 Jun', items: [
{ ...B, text: 'Bob removed Groceries: entered twice', kind: 'Expense', time: '20:02' },
{ ...B, text: 'Bob recorded Groceries · 60,00 €', kind: 'Expense', time: '19:55' }
] },
{ label: '17 Jun', items: [
{ ...E, text: 'Eve recorded Boat trip · 300,00 €', kind: 'Expense', time: '18:30' },
{ ...E, text: 'Eve joined the group, invited by Alice', kind: 'Member', time: '18:05' }
] },
{ label: '16 Jun', items: [
{ ...B, text: 'Bob corrected Dinner from 180,00 € to 200,00 €', kind: 'Expense', time: '22:10' },
{ ...D, text: 'David recorded Museum · 75,00 €', kind: 'Expense', time: '15:12' },
{ ...C, text: 'Carol recorded Rental car · 420,00 €', kind: 'Expense', time: '13:40' }
] },
{ label: '14 Jun', items: [
{ ...A, text: 'Alice created the group Mallorca 2027', kind: 'Group', time: '10:02' }
] }
]
};
}
}
</script>
</body>
</html>
