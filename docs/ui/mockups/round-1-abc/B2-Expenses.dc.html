<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trip: Expenses and add expense</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#0E7468}a:hover{color:#0A4F46}
</style>
</helmet>
<div style="position:relative; min-height:900px; overflow:hidden; background:#EEF6F4; color:#10312D; font-family:'Plus Jakarta Sans',system-ui,sans-serif; font-size:15px; line-height:1.5; font-variant-numeric:tabular-nums">

<header style="display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:16px; padding:18px 40px">
<div style="display:flex; align-items:center; gap:10px">
<div style="position:relative; width:40px; height:30px"><span style="position:absolute; left:0; top:0; width:30px; height:30px; border-radius:15px; background:#D64527"></span><span style="position:absolute; left:12px; top:0; width:30px; height:30px; border-radius:15px; background:#0E7468; opacity:.9"></span></div>
<div style="font-size:20px; font-weight:800; letter-spacing:-.02em">ShareWise</div>
</div>
<nav aria-label="Main" style="display:flex; gap:6px; padding:5px; border-radius:999px; background:#FFFFFF; box-shadow:0 2px 8px rgba(16,49,45,.06)">
<a href="#" style="padding:9px 20px; border-radius:999px; background:#10312D; color:#FFFFFF; font-weight:700; text-decoration:none">My groups</a>
<a href="#" style="display:flex; align-items:center; gap:8px; padding:9px 20px; border-radius:999px; color:#10312D; font-weight:600; text-decoration:none">Inbox<span style="min-width:20px; box-sizing:border-box; padding:0 6px; border-radius:10px; background:#D64527; color:#FFFFFF; font-size:12px; font-weight:700; text-align:center">3</span></a>
<a href="#" style="padding:9px 20px; border-radius:999px; color:#10312D; font-weight:600; text-decoration:none">Activity</a>
</nav>
<div style="width:44px; height:44px; border-radius:22px; background:#D64527; color:#FFFFFF; font-weight:800; display:flex; align-items:center; justify-content:center">A</div>
</header>

<main style="box-sizing:border-box; max-width:1180px; margin:0 auto; padding:6px 40px 44px; display:flex; flex-direction:column; gap:20px">

<section style="position:relative; overflow:hidden; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:16px; padding:24px 28px; border-radius:28px; background:#D64527; color:#FFFFFF">
<span style="position:absolute; right:-30px; top:-50px; width:170px; height:170px; border-radius:85px; background:#FFFFFF; opacity:.14"></span>
<div style="position:relative">
<div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap"><h1 style="margin:0; font-size:32px; font-weight:800; letter-spacing:-.03em">Mallorca 2027</h1><span style="padding:4px 12px; border-radius:999px; background:#FFFFFF; color:#10312D; font-size:12px; font-weight:700">Open</span></div>
<div style="margin-top:2px; opacity:.95">EUR · 5 members · up to date</div>
</div>
<div style="position:relative; display:flex; padding-left:10px">
<sc-for list="{{people}}" as="m" hint-placeholder-count="5"><span style="width:38px; height:38px; margin-left:-10px; box-sizing:border-box; border:3px solid #D64527; border-radius:19px; background:{{m.c}}; color:#FFFFFF; font-size:14px; font-weight:800; display:flex; align-items:center; justify-content:center">{{m.i}}</span></sc-for>
</div>
</section>

<div role="tablist" aria-label="Group sections" style="display:flex; flex-wrap:wrap; gap:8px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5"><a href="#" role="tab" style="display:flex; align-items:center; gap:8px; min-height:42px; padding:0 20px; border-radius:999px; font-weight:700; text-decoration:none; {{t.style}}">{{t.name}}<sc-if value="{{t.badge}}" hint-placeholder-val="{{false}}"><span style="min-width:20px; box-sizing:border-box; padding:0 6px; border-radius:10px; background:#D64527; color:#FFFFFF; font-size:12px; text-align:center">{{t.badge}}</span></sc-if></a></sc-for>
</div>

<section aria-labelledby="list" style="display:flex; flex-direction:column; gap:12px">
<div style="display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap"><h2 id="list" style="margin:0; font-size:18px; font-weight:800">Expenses</h2><span style="color:#55726E; font-size:14px">7 expenses · 2.205,00 € in total</span></div>
<sc-for list="{{expenses}}" as="e" hint-placeholder-count="6">
<div style="display:flex; align-items:center; gap:16px; padding:14px 20px; border-radius:22px; background:#FFFFFF; box-shadow:0 4px 14px rgba(16,49,45,.06); {{e.faded}}">
<span style="flex:0 0 auto; width:44px; height:44px; border-radius:22px; background:{{e.c}}; color:#FFFFFF; font-size:16px; font-weight:800; display:flex; align-items:center; justify-content:center">{{e.i}}</span>
<div style="flex:1; min-width:0"><div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap"><span style="font-weight:700; {{e.titleStyle}}">{{e.title}}</span><sc-if value="{{e.tag}}" hint-placeholder-val="{{false}}"><span style="padding:2px 10px; border-radius:999px; font-size:12px; font-weight:700; {{e.tagStyle}}">{{e.tag}}</span></sc-if></div><div style="font-size:13px; color:#55726E">{{e.meta}}</div></div>
<div style="text-align:right"><div style="font-weight:800; font-size:17px; {{e.titleStyle}}">{{e.amount}}</div><div style="font-size:13px; font-weight:600; {{e.partColor}}">{{e.part}}</div></div>
</div>
</sc-for>
</section>
</main>

<div role="dialog" aria-modal="true" aria-labelledby="add" style="position:absolute; top:0; right:0; bottom:0; left:0; background:rgba(16,49,45,.55); display:flex; align-items:flex-start; justify-content:center; padding:56px 20px 20px">
<div style="width:100%; max-width:560px; box-sizing:border-box; padding:26px 28px 28px; border-radius:30px; background:#FFFFFF; box-shadow:0 24px 60px rgba(16,49,45,.35); display:flex; flex-direction:column; gap:16px">
<div style="display:flex; align-items:center; justify-content:space-between"><h2 id="add" style="margin:0; font-size:24px; font-weight:800; letter-spacing:-.02em">Add expense</h2><button type="button" aria-label="Close" style="width:44px; height:44px; border:0; border-radius:22px; background:#EEF6F4; color:#10312D"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
<label style="display:flex; flex-direction:column; gap:6px; font-weight:700">Title<input type="text" value="Taxi to the airport" style="min-height:48px; box-sizing:border-box; padding:0 16px; border:2px solid #C5DAD5; border-radius:16px; font:inherit; font-weight:500; color:#10312D"></label>
<div style="display:flex; gap:12px">
<label style="flex:1.3; display:flex; flex-direction:column; gap:6px; font-weight:700">Amount (€)<input type="text" inputmode="decimal" value="84,00" style="min-width:0; min-height:56px; box-sizing:border-box; padding:0 16px; border:2px solid #0E7468; border-radius:16px; font:inherit; font-size:26px; font-weight:800; color:#10312D; text-align:right"></label>
<label style="flex:1; display:flex; flex-direction:column; gap:6px; font-weight:700">Date<input type="text" value="19 Jun 2027" style="min-width:0; min-height:56px; box-sizing:border-box; padding:0 14px; border:2px solid #C5DAD5; border-radius:16px; font:inherit; font-weight:500; color:#10312D"></label>
</div>
<fieldset style="margin:0; padding:0; border:0">
<legend style="padding:0; margin-bottom:8px; font-weight:700">Paid by</legend>
<div style="display:flex; gap:8px; flex-wrap:wrap">
<sc-for list="{{payers}}" as="p" hint-placeholder-count="5"><button type="button" aria-pressed="{{p.on}}" style="display:flex; align-items:center; gap:8px; min-height:44px; padding:0 14px 0 6px; border-radius:999px; font:inherit; font-weight:700; {{p.style}}"><span style="width:32px; height:32px; border-radius:16px; background:{{p.c}}; color:#FFFFFF; font-size:13px; font-weight:800; display:flex; align-items:center; justify-content:center">{{p.i}}</span>{{p.name}}</button></sc-for>
</div>
</fieldset>
<div role="group" aria-label="Split" style="display:flex; padding:4px; border-radius:999px; background:#EEF6F4">
<button type="button" aria-pressed="true" style="flex:1; min-height:42px; border:0; border-radius:999px; background:#10312D; color:#FFFFFF; font:inherit; font-weight:700">Equal</button>
<button type="button" aria-pressed="false" style="flex:1; min-height:42px; border:0; border-radius:999px; background:transparent; color:#35534F; font:inherit; font-weight:600">Exact</button>
<button type="button" aria-pressed="false" style="flex:1; min-height:42px; border:0; border-radius:999px; background:transparent; color:#35534F; font:inherit; font-weight:600">Percentage</button>
</div>
<fieldset style="margin:0; padding:0; border:0">
<div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px"><legend style="padding:0; font-weight:700; float:left">Split equally between</legend><button type="button" style="min-height:40px; padding:0 16px; border:2px solid #0E7468; border-radius:999px; background:#FFFFFF; color:#0A4F46; font:inherit; font-weight:700">Everyone</button></div>
<div style="display:flex; gap:8px; flex-wrap:wrap; clear:both">
<sc-for list="{{split}}" as="p" hint-placeholder-count="5"><button type="button" aria-pressed="{{p.on}}" style="display:flex; align-items:center; gap:8px; min-height:44px; padding:0 14px 0 6px; border-radius:999px; font:inherit; font-weight:700; {{p.style}}"><span style="width:32px; height:32px; border-radius:16px; background:{{p.c}}; color:#FFFFFF; font-size:13px; font-weight:800; display:flex; align-items:center; justify-content:center">{{p.i}}</span>{{p.name}}<span style="font-size:12px; font-weight:600">{{p.note}}</span></button></sc-for>
</div>
</fieldset>
<div style="padding:12px 16px; border-radius:16px; background:#D8F0EB; color:#0A4F46; font-weight:700">4 people · 21,00 € each</div>
<button type="button" style="min-height:52px; border:0; border-radius:999px; background:#D64527; color:#FFFFFF; font:inherit; font-size:16px; font-weight:800">Add expense</button>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const A = { i: 'A', c: '#D64527' };
const B = { i: 'B', c: '#0E7468' };
const C = { i: 'C', c: '#5B45C9' };
const D = { i: 'D', c: '#9A6200' };
const E = { i: 'E', c: '#1E64B7' };
const pos = 'color:#0E7468';
const neg = 'color:#B8391C';
const none = 'color:#55726E';
const tabOn = 'background:#10312D; color:#FFFFFF';
const tabOff = 'background:#FFFFFF; color:#10312D';
const chipOn = 'border:2px solid #0E7468; background:#D8F0EB; color:#0A4F46';
const chipOff = 'border:2px solid #C5DAD5; background:#FFFFFF; color:#10312D';
return {
people: [A, B, C, D, E],
tabs: [
{ name: 'Expenses', style: tabOn, badge: '' },
{ name: 'Balances', style: tabOff, badge: '' },
{ name: 'Settle up', style: tabOff, badge: '1' },
{ name: 'Members', style: tabOff, badge: '' },
{ name: 'Activity', style: tabOff, badge: '' }
],
expenses: [
{ ...A, title: 'Farewell dinner', meta: '19 Jun · Alice paid · exact split between 5', amount: '250,00 €', part: 'You lent 200,00 €', partColor: pos, tag: '', tagStyle: '', titleStyle: '', faded: '' },
{ ...B, title: 'Groceries', meta: '18 Jun · Bob paid · split equally between 5', amount: '60,00 €', part: 'You owe 12,00 €', partColor: neg, tag: '', tagStyle: '', titleStyle: '', faded: '' },
{ ...B, title: 'Groceries', meta: '18 Jun · Bob removed it: entered twice', amount: '60,00 €', part: 'Not counted', partColor: none, tag: 'Removed', tagStyle: 'background:#E3ECE9; color:#35534F', titleStyle: 'text-decoration:line-through; color:#55726E', faded: 'opacity:.75' },
{ ...E, title: 'Boat trip', meta: '17 Jun · Eve paid · split equally between 3', amount: '300,00 €', part: 'You owe 100,00 €', partColor: neg, tag: '', tagStyle: '', titleStyle: '', faded: '' },
{ ...D, title: 'Museum', meta: '16 Jun · David paid · you are not part of it', amount: '75,00 €', part: 'Not involved', partColor: none, tag: '', tagStyle: '', titleStyle: '', faded: '' },
{ ...C, title: 'Rental car', meta: '16 Jun · Carol paid · split equally between 3', amount: '420,00 €', part: 'You owe 140,00 €', partColor: neg, tag: '', tagStyle: '', titleStyle: '', faded: '' }
],
payers: [
{ ...A, name: 'Alice (you)', on: true, style: chipOn },
{ ...B, name: 'Bob', on: false, style: chipOff },
{ ...C, name: 'Carol', on: false, style: chipOff },
{ ...D, name: 'David', on: false, style: chipOff },
{ ...E, name: 'Eve', on: false, style: chipOff }
],
split: [
{ ...A, name: 'You', note: 'always in', on: true, style: chipOn },
{ ...B, name: 'Bob', note: '', on: true, style: chipOn },
{ ...C, name: 'Carol', note: '', on: true, style: chipOn },
{ ...D, name: 'David', note: '', on: true, style: chipOn },
{ ...E, name: 'Eve', note: '', on: false, style: chipOff }
]
};
}
}
</script>
</body>
</html>
