spring:
  application:
    name: sharewise
  datasource:
    # Local Postgres from docker-compose.yml. Tests replace it with a Testcontainers database.
    url: jdbc:postgresql://localhost:5432/sharewise
    username: sharewise
    password: sharewise
  security:
    oauth2:
      resourceserver:
        jwt:
          # The sharewise realm of the local Keycloak from docker-compose.yml (D3, C5). Tests replace it with the
          # Testcontainers Keycloak. The signing keys are fetched on the first token, so the backend starts without
          # Keycloak (F13).
          issuer-uri: http://localhost:8180/realms/sharewise
  modulith:
    events:
      # An event whose listener failed or was cut off (for example by a restart) stays unfinished in
      # event_publication. Without this it is never delivered again and its balance update is lost for good.
      republish-outstanding-events-on-restart: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    # One folder per module. Versions are prefixed per module:
    # shared V0xx, account V1xx, group V2xx, expense V3xx, settlement V4xx.
    # Out of order, because a new account migration (V104) must still run on a database that already
    # has a settlement migration (V401).
    out-of-order: true
    locations:
      - classpath:db/migration/shared
      - classpath:db/migration/account
      - classpath:db/migration/group
      - classpath:db/migration/expense
      - classpath:db/migration/settlement
